plugins {
  id 'java-library'
  //id 'application'
  id 'com.vanniktech.maven.publish' version '0.34.0'
}


apply plugin: 'signing'
signing {
    useGpgCmd()
    sign publishing.publications
}


group = 'io.github.isthisalis'
version = '1.0.6'


project.ext.jomlVersion = "1.10.9"


repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


mavenPublishing {
    publishToMavenCentral()

    coordinates('io.github.isthisalis', 'rephysics', version)

    pom {
        name = 'RePhysics'
        description = 'Physical library, part of ReCore'
        url = 'https://github.com/IsThisALis/ReCore'

        licenses {
            license {
                name = 'MIT'
                url = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'IsThisALis'
                email = 'gamemodebronze2@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/IsThisALis/AiLib'
        }
    }
}


publishing {
    repositories {
        maven {
            name = 'github'
            url = 'https://maven.pkg.github.com/IsThisALis/ReCore'
            credentials {
                username = findProperty('githubUsername') ?: System.getenv('GITHUB_USER')
                password = findProperty('githubToken') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}


dependencies {
    implementation 'org.joml:joml:1.10.9'
    //implementation 'io.github.isthisalis:recore:1.0.6'
    implementation project(':recore')
    
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
}


tasks.named ('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '1G'

    testLogging {
      events "passed"
    }
  }


afterEvaluate {
    tasks.configureEach { task ->
        if (task.name.contains('generateMetadataFile')) {
            task.dependsOn tasks.matching { it.name.contains('JavadocJar') }
        }
    }
}
