import org.gradle.internal.os.OperatingSystem

plugins {
  id 'java-library'
  //id 'application'
  id 'com.vanniktech.maven.publish' version '0.34.0'
}

apply plugin: 'signing'
signing {
    useGpgCmd()
    sign publishing.publications
}

project.ext.lwjglVersion = "3.4.1"
project.ext.jomlVersion = "1.10.9"

switch (OperatingSystem.current()) {
	case OperatingSystem.LINUX:
		project.ext.lwjglNatives = "natives-linux"
		def osArch = System.getProperty("os.arch")
		if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
			project.ext.lwjglNatives += osArch.contains("64") || osArch.startsWith("armv8") ? "-arm64" : "-arm32"
		} else if  (osArch.startsWith("ppc")) {
			project.ext.lwjglNatives += "-ppc64le"
		} else if  (osArch.startsWith("riscv")) {
			project.ext.lwjglNatives += "-riscv64"
		}
		break
	case OperatingSystem.MAC_OS:
		project.ext.lwjglNatives = "natives-macos"
		break
	case OperatingSystem.WINDOWS:
		project.ext.lwjglNatives = "natives-windows"
		break
}


group = 'io.github.isthisalis'
version = '1.6.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

mavenPublishing {
    publishToMavenCentral()

    coordinates('io.github.isthisalis', 'recore', version)

    pom {
        name = 'ReCore'
        description = 'Java OpenGL game engine'
        url = 'https://github.com/IsThisALis/ReCore'

        licenses {
            license {
                name = 'MIT'
                url = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'IsThisALis'
                email = 'gamemodebronze2@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/IsThisALis/AiLib'
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'github'
            url = 'https://maven.pkg.github.com/IsThisALis/AiLib'
            credentials {
                username = findProperty('githubUsername') ?: System.getenv('GITHUB_USER')
                password = findProperty('githubToken') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

dependencies {
	implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

	implementation "org.lwjgl:lwjgl"
	implementation "org.lwjgl:lwjgl-glfw"
	implementation "org.lwjgl:lwjgl-opengl"
	implementation "org.lwjgl:lwjgl-stb"
    
	implementation "org.lwjgl:lwjgl::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-glfw::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-opengl::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-stb::$lwjglNatives"

	api "org.joml:joml:$jomlVersion"

  testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  compileOnly 'org.projectlombok:lombok:1.18.46'
  annotationProcessor 'org.projectlombok:lombok:1.18.46'
}


tasks.named ('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '1G'

    testLogging {
      events "passed"
    }
  }

afterEvaluate {
    tasks.configureEach { task ->
        if (task.name.contains('generateMetadataFile')) {
            task.dependsOn tasks.matching { it.name.contains('JavadocJar') }
        }
    }
}
